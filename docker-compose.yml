services:
  nutella-tracker:
    # Lokal bauen ...
    build: .
    # ... oder das per Pipeline veröffentlichte Image verwenden:
    # image: ghcr.io/daknoblo/nutella-tracker:latest
    container_name: nutella-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_FILE: "/appdata/nutella.json"
      # Optional: Foto-Erkennung via Microsoft Foundry / Azure OpenAI Vision.
      # Den Secret-Key NICHT hier eintragen, sondern über die Umgebung/.env
      # bereitstellen, damit er nicht im Repo landet.
      AZURE_VISION_ENDPOINT: "${AZURE_VISION_ENDPOINT:-}"
      AZURE_VISION_KEY: "${AZURE_VISION_KEY:-}"
      AZURE_VISION_MODEL: "${AZURE_VISION_MODEL:-}"
      AZURE_VISION_API_VERSION: "${AZURE_VISION_API_VERSION:-2024-08-01-preview}"
    volumes:
      # JSON-Datenspeicher persistent halten (überlebt Container-Neustart).
      # Variante A (empfohlen): von Docker verwaltetes Named Volume.
      - nutella-data:/appdata
      # Variante B: Bind-Mount in einen Host-Ordner (JSON direkt sichtbar).
      #   Für non-root (UID/GID 65532) muss der Host-Ordner beschreibbar sein.
      # - ./appdata:/appdata

volumes:
  nutella-data:
